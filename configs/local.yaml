# Full main-task experiment on the M4 Pro (MPS, float32). Start it explicitly; nothing runs it
# automatically. The sequence budgets are starting points, not known-sufficient sizes.
name: local

data:
  manifest_dir: data/manifests/full
  train_source_fraction: 1.0
  val_source_fraction: 1.0
  test_source_fraction: 1.0
  num_train_sequences: 100000
  num_val_sequences: 20000
  num_test_sequences: 20000
  num_diagnostic_sequences: 1000

augment:
  mode: affine          # compare against none / affine_elastic with --set augment.mode=...

model:
  cnn_activation: relu    # relu | gelu (the original encoder used gelu)
  cnn_pooling: max        # max | avg
  cnn_batch_norm: true    # BatchNorm after each conv

train:
  device: auto
  seed: 0
  batch_size: 256        # optimizer steps per epoch (train_sequences // batch_size)
  grad_accum_steps: 1
  epochs: 200            # ~30k optimizer steps, currently takes ~ 6 minutes per training run.
  max_steps: null
  eval_every_steps: 1000
  log_every_steps: 50
  lr: 3.0e-4
  weight_decay: 0.01
  grad_clip_norm: 1.0
  lr_schedule: warmup_cosine
  warmup_steps: 500
  early_stopping_patience: 15   # stop after 15 validations in a row without a new highest val accuracy (null = off)
  early_stopping_min_delta: 0.0 # how much higher the accuracy must be to count (e.g. 0.001 = 0.1 points)
  num_workers: 4        # No more than 4 is necessary, currently GPU is bottleneck.
  persistent_workers: true  # keep workers alive across epochs + validations (no restart cost)
  pin_memory: false
  amp_dtype: none       # float32 on MPS

logging:
  wandb_mode: online   # no network needed; `wandb sync` later, or --set logging.wandb_mode=online
  wandb_project: digit-summation
  wandb_entity: neoscith-solo

eval:
  batch_size: 256
  num_stress_image_sequences: 50
